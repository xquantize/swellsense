- id: matakana-island
  name: Matakana Island (ocean beach)
  region: Bay of Plenty
  lat: -37.560
  lon: 176.070
  facing_deg: 45
  break_type: beach
  bottom: sand
  swell_window:
    start_deg: 0
    end_deg: 90
  best_tides: [low]
  tide_rising_better: true
  tide_confidence: conflicting
  tide_notes: >-
    Guides disagree. One says every tide works. Another says low is better,
    especially while the tide is rising, which is the tide recorded here.
  min_skill: advanced
  hazards:
    - dangerous rips
  access: boat
  notes: Exposed ocean beach that mostly picks up groundswell.
  sources:
    - name: surf-forecast.com
      url: https://www.surf-forecast.com/breaks/Matakana-Island
    - name: Surfnerd
      url: https://www.surfnerd.com/surf-forecast/matakana-island
  verified: false

