# Baseline Bay of Plenty profiles. Coordinates are approximate.
# facing_deg is 45 (north-east): a south-west wind is offshore along this coast.
# forecast_lat / forecast_lon: optional offshore point when the beach coordinate
# falls on a land cell in the marine grid. Omit them to use lat / lon.
# verified stays false until a local has checked the spot.
# Notes are paraphrased from the listed pages. Do not paste their text.

- id: mount-main-beach
  name: Mount Main Beach
  region: Bay of Plenty
  lat: -37.632
  lon: 176.180
  facing_deg: 45
  break_type: beach
  bottom: sand
  swell_window:
    start_deg: 0
    end_deg: 90
  best_tides: [low, mid]
  tide_rising_better: null
  tide_confidence: conflicting
  tide_notes: >-
    Low and mid are the tides that come up most often. A tourism guide leans
    mid to low, Surfline leans low to mid, and surf-forecast says the tide
    does not change the wave.
  min_skill: beginner
  hazards: []
  access: road
  notes: >-
    Peaky beach breaks, plus a right-hand point off Moturiki (the blowhole)
    at the south end. Sheltered when the wind is south-east. The northern end
    near Mauao is steeper and bigger, and a bigger swell can close the beach
    out. Very crowded from December to February.
  sources:
    - name: Bay of Plenty NZ
      url: https://bayofplentynz.com/experiences/oceans-and-beaches/the-bays-best-surf-spots/
    - name: Surfline
      url: https://www.surfline.com/surf-report/mt-maunganui-main-beach/5842041f4e65fad6a7708d84
    - name: surf-forecast.com
      url: https://www.surf-forecast.com/breaks/Mount-Maunguni
    - name: Surf Atlas
      url: https://thesurfatlas.com/surfing-new-zealand/mount-maunganui-surf/
    - name: Surfnerd
      url: https://www.surfnerd.com/surf-forecast/mount-maunganui-main-beach
  verified: false

- id: tay-street
  name: Tay Street
  region: Bay of Plenty
  lat: -37.645
  lon: 176.198
  facing_deg: 45
  break_type: beach
  bottom: sand
  swell_window:
    start_deg: 0
    end_deg: 100
  best_tides: [high]
  tide_rising_better: null
  tide_confidence: conflicting
  tide_notes: >-
    Guides disagree. One says the bank works on every tide. A local surf
    school says it is best around high, which is the tide recorded here.
  min_skill: intermediate
  hazards: []
  access: road
  notes: >-
    Lefts and rights, with short rides. Flatter and more exposed than Main
    Beach, and often bigger. Handles a north-west wind better than Main Beach.
    This is the busiest bank.
  sources:
    - name: surf-forecast.com
      url: https://www.surf-forecast.com/breaks/Taystreet
    - name: Mount Surf School
      url: https://mountsurfschool.co.nz/where-to-surf-in-mount-maunganui/
    - name: Surfnerd
      url: https://www.surfnerd.com/surf-forecast/tay-street
    - name: Surf Seeker
      url: https://surfseeker.nz/surf_breaks/bay-plenty/tay-street/
    - name: Mondo Surf
      url: https://www.mondo.surf/surf-spot/tay-street/guide/13200
    - name: Surf Atlas
      url: https://thesurfatlas.com/surfing-new-zealand/mount-maunganui-surf/
  verified: false

