[project]
name = "swellsense"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Zane", email = "zane.n.neave@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "openai>=3.29.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
swellsense = "swellsense.cli:main"

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
